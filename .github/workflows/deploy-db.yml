# Applies new migrations to the production database after they reach main.
# Runs only when files under supabase/migrations change. Secrets live in the
# protected GitHub Environment "production" (deployments from main only).
# Migrations must be backward compatible with the deployed frontend: see docs/CICD.md.
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a migration halfway; queue the next one instead.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: deploy-db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.115.0
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations (local vs production)
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Apply
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations after the push
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
