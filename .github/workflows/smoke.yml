# Smoke test of production after every successful Vercel production deployment
# (Vercel reports deployments to GitHub). Opens an issue with rollback steps on failure.
name: Production smoke test

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-production
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
      SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
      DEPLOY_SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
      - name: Smoke test ${{ vars.PRODUCTION_URL }}
        run: npm run test:smoke
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh "Production smoke test failed"
