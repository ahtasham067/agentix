name: Start local Supabase
description: >
  Starts the local Supabase stack from supabase/config.toml (database, REST API and
  the Mailpit mail catcher only), applies migrations and the seed, and writes
  .env.local with the local keys, exactly like `npm run db:env` on a laptop.
runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      with:
        version: 2.115.0
    - name: Start Supabase
      shell: bash
      run: >
        supabase start
        -x gotrue,realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
    - name: Write .env.local
      shell: bash
      run: npm run db:env
